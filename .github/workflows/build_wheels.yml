name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  populate_caches:
    name: Populate dependency caches
    runs-on: ubuntu-latest
    outputs:
      cfitsio: ${{ steps.versions.outputs.cfitsio }}
      gsl: ${{ steps.versions.outputs.gsl }}
      hepmc3: ${{ steps.versions.outputs.hepmc3 }}
    steps:
      - uses: actions/checkout@v5

      - name: Read dependency versions
        id: versions
        shell: bash
        run: |
          version() { grep "^$1_VERSION=" tools/wheels/cibw_before_all.sh | cut -d'"' -f2; }
          echo "cfitsio=$(version CFITSIO)" >> "$GITHUB_OUTPUT"
          echo "gsl=$(version GSL)" >> "$GITHUB_OUTPUT"
          echo "hepmc3=$(version HEPMC3)" >> "$GITHUB_OUTPUT"

      # One cache entry per tarball, so bumping one version re-downloads only
      # that one. Keys and paths match the restores below and tests.yml.
      - name: Cache cfitsio source tarball
        id: cfitsio
        uses: actions/cache@v5
        with:
          path: .cfitsio-cache
          key: cfitsio-${{ steps.versions.outputs.cfitsio }}-v1

      - name: Download cfitsio if not cached
        if: steps.cfitsio.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash tools/wheels/fetch_cfitsio.sh "${{ steps.versions.outputs.cfitsio }}" \
            ".cfitsio-cache/cfitsio-${{ steps.versions.outputs.cfitsio }}.tar.gz"

      - name: Cache GSL source tarball
        id: gsl
        uses: actions/cache@v5
        with:
          path: .gsl-cache
          key: gsl-${{ steps.versions.outputs.gsl }}-v1

      - name: Download GSL if not cached
        if: steps.gsl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash tools/wheels/fetch_gsl.sh "${{ steps.versions.outputs.gsl }}" \
            ".gsl-cache/gsl-${{ steps.versions.outputs.gsl }}.tar.gz"

      - name: Cache HepMC3 source tarball
        id: hepmc3
        uses: actions/cache@v5
        with:
          path: .hepmc3-cache
          key: hepmc3-${{ steps.versions.outputs.hepmc3 }}-v1

      - name: Download HepMC3 if not cached
        if: steps.hepmc3.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash tools/wheels/fetch_hepmc3.sh "${{ steps.versions.outputs.hepmc3 }}" \
            ".hepmc3-cache/HepMC3-${{ steps.versions.outputs.hepmc3 }}.tar.gz"

  build_wheels_macos:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }}) - ${{ matrix.py }}
    needs: [populate_caches]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Build each wheel exactly once: macos-14 (Apple Silicon) for arm64,
        # macos-15-intel for x86_64. Building arm64 on both macos-14 and
        # macos-15 previously produced two identically-named wheels that
        # collided in the merge job and corrupted via torn concurrent writes.
        os: [macos-14, macos-15-intel]
        py: [cp38, cp39, cp310, cp311, cp312]
        arch: [arm64, x86_64]
        exclude:
          # macos-14 is an Apple Silicon runner
          - os: macos-14
            arch: x86_64
          # macos-15-intel is an Intel runner
          - os: macos-15-intel
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      # IMPORTANT: CPython 3.8 on arm64 uses an x86_64 Python under Rosetta by default.
      # Installing a native arm64 Python 3.8 avoids CMake thinking it's x86_64.
      - name: Install native Python 3.8 (arm64 runner only)
        uses: actions/setup-python@v6
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.py == 'cp38'
        with:
          python-version: '3.8'

      - name: Restore cfitsio source tarball
        uses: actions/cache/restore@v5
        with:
          path: .cfitsio-cache
          key: cfitsio-${{ needs.populate_caches.outputs.cfitsio }}-v1

      - name: Restore GSL source tarball
        uses: actions/cache/restore@v5
        with:
          path: .gsl-cache
          key: gsl-${{ needs.populate_caches.outputs.gsl }}-v1

      - name: Restore HepMC3 source tarball
        uses: actions/cache/restore@v5
        with:
          path: .hepmc3-cache
          key: hepmc3-${{ needs.populate_caches.outputs.hepmc3 }}-v1

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.py }}-*
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.py }}
          path: ./wheelhouse/*.whl

  build_wheels_linux:
    name: Build wheels on ${{ matrix.os }} - ${{ matrix.py }} - ${{ matrix.image }}_${{ matrix.arch }}
    needs: [populate_caches]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py: [cp38, cp39, cp310, cp311, cp312]
        image: [manylinux, musllinux]
        arch: [x86_64, aarch64]
        include:
          # Native runners per arch - aarch64 emulated under qemu was 13x
          # slower (~80min vs ~6min), and GitHub now offers free arm64
          # Linux runners for public repos.
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Restore cfitsio source tarball
        uses: actions/cache/restore@v5
        with:
          path: .cfitsio-cache
          key: cfitsio-${{ needs.populate_caches.outputs.cfitsio }}-v1

      - name: Restore HepMC3 source tarball
        uses: actions/cache/restore@v5
        with:
          path: .hepmc3-cache
          key: hepmc3-${{ needs.populate_caches.outputs.hepmc3 }}-v1

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.py }}-${{ matrix.image }}_${{ matrix.arch }}
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.image }}_${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  merge:
    runs-on: ubuntu-latest
    needs: [build_wheels_macos, build_wheels_linux]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v6
        with:
          delete-merged: true
